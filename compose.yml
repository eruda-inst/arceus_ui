services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_API_URL: ${NEXT_PUBLIC_BASE_API_URL}
    container_name: absol-ui
    environment:
      NODE_ENV: "development"
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_BASE_API_URL: ${NEXT_PUBLIC_BASE_API_URL}
    env_file:
      - .env
    ports:
      - "3000:3000"
